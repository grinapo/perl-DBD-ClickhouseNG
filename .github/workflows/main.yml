name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Debian stable: perl 5.40 and every prerequisite come from apt, so the
    # same packages satisfy both the test run and dpkg-checkbuilddeps.
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      CH_CERTS: /etc/clickhouse-server/certs
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Perl dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            perl libmodule-build-tiny-perl libdbi-perl libio-socket-ssl-perl \
            libnet-http-perl libjson-pp-perl curl ca-certificates gnupg openssl

      # v<decimal version> tags (v0.53, v0.5301) publish a GitHub release
      # (job "release"); fail early if the tag disagrees with $VERSION.
      # t/02-version.t keeps META.json and Changes in line with $VERSION.
      - name: Detect release tag
        id: release
        shell: bash
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+)$ ]] || exit 0
          VER="${BASH_REMATCH[1]}"
          MODVER="$( perl -MExtUtils::MakeMaker -e 'print MM->parse_version(shift)' lib/DBD/ClickhouseNG.pm )"
          [ "$MODVER" = "$VER" ] || { echo "tag v$VER but \$VERSION is $MODVER"; exit 1; }
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Install ClickHouse server
        run: |
          curl -fsSL 'https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key' \
            | gpg --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg arch=$(dpkg --print-architecture)] https://packages.clickhouse.com/deb lts main" \
            > /etc/apt/sources.list.d/clickhouse.list
          apt-get update
          apt-get install -y clickhouse-server clickhouse-client

      - name: Configure HTTPS and the mTLS user, start ClickHouse
        run: |
          bash .github/ci-tls-setup.sh /etc/clickhouse-server
          runuser -u clickhouse -- clickhouse-server \
            --config-file=/etc/clickhouse-server/config.xml --daemon
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && break
            sleep 1
          done
          curl -sf http://localhost:8123/ping
          curl -sf --cacert "$CH_CERTS/ca.crt" https://localhost:8443/ping

      - name: Enable live integration tests
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          CHNG_TEST_DSN=dbi:ClickhouseNG:host=localhost
          CHNG_TEST_TLS_HOST=localhost
          CHNG_TEST_TLS_WRONG_HOST=127.0.0.1
          CHNG_TEST_TLS_CA=$CH_CERTS/ca.crt
          CHNG_TEST_MTLS_HOST=localhost
          CHNG_TEST_MTLS_USER=chng_mtls
          CHNG_TEST_MTLS_CERT=$CH_CERTS/client.crt
          CHNG_TEST_MTLS_KEY=$CH_CERTS/client.key
          CHNG_TEST_MTLS_CA=$CH_CERTS/ca.crt
          EOF

      - name: Run tests
        run: |
          perl Build.PL
          ./Build
          ./Build test

      - name: Install packaging tools (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: apt-get install -y dh-make-perl fakeroot dpkg-dev

      - name: Build release artifacts (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          release/build-tarball.sh --allow-dirty
          release/build-deb.sh --allow-dirty

      - name: Upload release artifacts (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: release/dist/*
          if-no-files-found: error

  release:
    needs: test
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          export VER="${TAG#v}"
          perl -00 -ne 'print if /^\Q$ENV{VER}\E\s/' Changes > notes.md
          gh release create "$TAG" dist/* --verify-tag --title "$VER" --notes-file notes.md
