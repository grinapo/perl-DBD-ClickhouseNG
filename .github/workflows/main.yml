name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Debian stable: perl 5.40 and every prerequisite come from apt, so the
    # same packages satisfy both the test run and dpkg-checkbuilddeps.
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    services:
      # Service containers cannot be made conditional; it is only used by the
      # live tests, which are enabled on tag builds below.
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Perl dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            perl libmodule-build-tiny-perl libdbi-perl libio-socket-ssl-perl \
            libnet-http-perl libjson-pp-perl curl ca-certificates

      - name: Enable live integration tests (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for i in $(seq 1 30); do
            curl -sf http://clickhouse:8123/ping && break
            sleep 1
          done
          curl -sf http://clickhouse:8123/ping
          echo "CHNG_TEST_DSN=dbi:ClickhouseNG:host=clickhouse" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          perl Build.PL
          ./Build
          ./Build test

      - name: Install packaging tools (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: apt-get install -y dh-make-perl fakeroot dpkg-dev

      - name: Build release artifacts (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          release/build-tarball.sh --allow-dirty
          release/build-deb.sh --allow-dirty

      - name: Upload release artifacts (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: release/dist/*
          if-no-files-found: error
